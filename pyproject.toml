[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kipr"
version = "0.1.0"
description = "KiCad review: visual and semantic diffs of symbols, footprints, schematics, layouts and 3D PCBAs"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []

[project.scripts]
kipr = "kipr.cli:main"

[tool.setuptools.packages.find]
include = ["kipr*"]
